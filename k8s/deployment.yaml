apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-backend
  labels:
    app: enterprise-backend
    tier: api
spec:
  replicas: 2 # Alta disponibilidad: 2 réplicas activas simultáneas
  selector:
    matchLabels:
      app: enterprise-backend
  template:
    metadata:
      labels:
        app: enterprise-backend
    spec:
      containers:
        - name: enterprise-backend
          image: xavier/enterprise-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # Kubernetes Liveness Probe: Reinicia el pod si la aplicación se congela
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          # Kubernetes Readiness Probe: No envía tráfico hasta que la app esté 100% lista
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: enterprise-backend-service
spec:
  type: ClusterIP
  selector:
    app: enterprise-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

