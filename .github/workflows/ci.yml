name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ==========================================
  # FASE 1: Verificación, Compilación y Pruebas
  # ==========================================
  build-and-test:
    name: Build & Verify (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21 LTS (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Dar permisos de ejecución a Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar y Verificar Proyecto
        run: ./mvnw clean verify -B

  # ==========================================
  # FASE 2: Empaquetado y Construcción Docker
  # ==========================================
  docker-build:
    name: Build Multi-Stage Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir Imagen Docker de Producción
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: xavier/enterprise-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

