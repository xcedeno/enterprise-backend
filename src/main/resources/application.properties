spring.application.name=enterprise-backend
server.port=8080

# Database Configuration (In-Memory PostgreSQL mode for immediate development)
spring.datasource.url=jdbc:h2:mem:enterprisedb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console: Web UI para inspeccionar la base de datos en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate: crea y actualiza tablas automáticamente y muestra las consultas SQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Observabilidad (Prometheus y métricas para la vacante)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Kafka Configuration (Apache Kafka / Event-Driven Architecture)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.xavier.enterprise.event
spring.kafka.consumer.auto-offset-reset=earliest
# Auto-startup false para permitir desarrollo local fluido cuando no esté encendido el contenedor de Kafka
spring.kafka.listener.auto-startup=false
